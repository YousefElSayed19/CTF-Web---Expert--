version: "3.9"

services:
  vaultcorp:
    build:
      context: ../src
      dockerfile: Dockerfile
      args:
        # Flag plaintext lives only here (a service file inside the lab
        # directory) — it must never be written to lab.yml, README.md,
        # or anywhere outside labs/. The SHA-256 of this exact string
        # (braces included) is recorded as flag_hash in lab.yml.
        FLAG: "duck{z80wxfgg31zc62xcgeq7qt77s6323iq3}"
    container_name: vaultcorp
    networks:
      - internal_only
    ports:
      - "5000:5000"
    volumes:
      # Persist SQLite DB across restarts
      - vaultcorp_data:/app/data
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

networks:
  # No outbound internet access from the container at runtime — nothing
  # in the intended solve path needs egress (the RCE is only ever used
  # to read a local file). Published ports still work normally: Docker
  # handles inbound port mapping at the host level via iptables DNAT,
  # independent of this network's "internal" flag, so the player can
  # still reach http://localhost:5000 as usual.
  internal_only:
    internal: true

volumes:
  vaultcorp_data:
